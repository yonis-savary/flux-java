spring.application.name=flux-api
server.servlet.context-path=/api

# Custom
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

# Data
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#logging.level.root=debug

spring.jpa.properties.hibernate.transaction.factory_class=org.hibernate.engine.transaction.internal.jdbc.JdbcTransactionFactory
spring.jpa.properties.hibernate.current_session_context_class=thread

# migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.connectRetries=10
spring.flyway.connectRetriesInterval=5000
spring.flyway.schemas=public
logging.level.org.flywaydb=DEBUG
logging.level.org.flyway=DEBUG


# JSON Docs
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/public/api-docs.yaml
springdoc.model-and-view-allowed=true